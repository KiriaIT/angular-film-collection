<header class="header">
  <a routerLink="/" class="header__logo">🎬 {{ appName }}</a>
  <div class="header__right">
    <nav class="header__nav" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="header__link"
        >Home</a
      >
      <a
        routerLink="/favorites"
        routerLinkActive="header__link--active"
        class="header__link"
        [attr.aria-label]="'Favorites: ' + favoritesCount().length + ' films'"
      >Favorites
        @if (favoritesCount().length > 0) {
          <span class="header__badge" aria-hidden="true">{{ favoritesCount().length }}</span>
        }
      </a>
      <a routerLink="/about" routerLinkActive="header__link--active" class="header__link">About</a>
    </nav>
    <app-theme-toggle />
  </div>
</header>
