<article
  class="film-card"
  [@cardEnter]
  [routerLink]="['/film', film().id]"
  [attr.aria-label]="'View details for ' + film().title"
>
  <div class="film-card__media">
    <img
      [src]="posterSrc()"
      [alt]="film().title"
      class="film-card__poster"
      loading="lazy"
      width="300"
      height="450"
      decoding="async"
      (error)="onPosterError($event)"
    />
  </div>
  <div class="film-card__body">
    <button
      type="button"
      class="film-card__fav"
      [class.film-card__fav--active]="film().isFavorite"
      [attr.aria-label]="film().isFavorite ? 'Remove from favorites' : 'Add to favorites'"
      (click)="onToggleFavorite($event)"
    >
      <span class="film-card__fav-icon" aria-hidden="true">{{ film().isFavorite ? '♥' : '♡' }}</span>
    </button>
    <h3 class="film-card__title">{{ film().title }}</h3>
    <div class="film-card__meta">
      <span>{{ film().year }}</span>
      <span>{{ film().genre }}</span>
      <span [class.film-card__rating--high]="isHighRated()">★ {{ film().rating }}</span>
    </div>
  </div>
</article>
